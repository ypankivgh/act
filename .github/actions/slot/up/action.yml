name: Slot up
description: >-
  Creates slot <name> in staging, or updates its settings if it exists: the folder
  azure/staging/slots/<name>/ with a settings.json pointed at data set <name> (run data/up first)
  and the `pr` Shopify app. Gives the slot settings, not code: deploy puts the code in. Needs the
  _azure_ branch at azure/; save afterwards.

inputs:
  name:
    description: Slot name, e.g. pr-3. Lowercase words joined by single hyphens, at most 8 characters.
    required: true

outputs:
  url:
    description: The slot's address.
    value: ${{ steps.slots.outputs.url }}

runs:
  using: composite
  steps:
    - name: Check the name
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        [[ $NAME =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && ${#NAME} -le 8 && $NAME != production && $NAME != preprod ]] \
          || { echo "::error::'$NAME' must be lowercase words joined by single hyphens, at most 8 characters"; exit 1; }

    - name: Create the slots
      id: slots
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      run: |
        bash infrastructure/settings.sh staging "$NAME" pr
        echo "url=$PAGES/staging/slots/$NAME/" >>"$GITHUB_OUTPUT"
