name: Slot down
description: >-
  Deletes a slot in staging: every data file ending in --<name> and, with compute, the slot folder.
  Running it twice is harmless. Needs the _azure_ branch at azure/; save afterwards.

  It cannot reach main data: no main name contains `--`, production and preprod are refused, and
  anything listed in LOCKS is refused. In real Azure that last check is a CanNotDelete lock that
  Azure enforces; here it is only this script reading a file (see README).

inputs:
  name:
    description: Slot name.
    required: true
  compute:
    description: "'false' deletes only the data, as for local development."
    default: 'true'

runs:
  using: composite
  steps:
    - name: Check the name
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        [[ $NAME =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && ${#NAME} -le 8 && $NAME != production && $NAME != preprod ]] \
          || { echo "::error::'$NAME' is not a slot that can be deleted"; exit 1; }

    - name: Delete
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        COMPUTE: ${{ inputs.compute }}
      run: |
        set -euo pipefail
        root=azure/staging
        targets=$(cd "$root" && find data -name "*--$NAME.json" 2>/dev/null || true)
        if [[ $COMPUTE == true && -d $root/slots/$NAME ]]; then targets+=$'\n'"slots/$NAME"; fi

        while read -r target; do
          [[ -z $target ]] && continue
          if grep -qxF "$target" "$root/LOCKS" 2>/dev/null; then
            echo "::error::$target is locked"; exit 1
          fi
          rm -rf "${root:?}/$target"
          echo "Deleted staging/$target" >>"$GITHUB_STEP_SUMMARY"
        done <<<"$targets"
