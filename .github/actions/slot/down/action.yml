name: Slot down
description: >-
  Deletes slot <name> in staging: the folder azure/staging/slots/<name>/. Its data set stays:
  data/down deletes that. Running it twice is harmless. Needs the _azure_ branch at azure/; save
  afterwards.

  It cannot reach a production slot: production and preprod are refused, and anything listed in
  LOCKS is refused (a stand-in for Azure's own enforcement, see README).

inputs:
  name:
    description: Slot name.
    required: true

runs:
  using: composite
  steps:
    - name: Check the name
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        [[ $NAME =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && ${#NAME} -le 8 && $NAME != production && $NAME != preprod ]] \
          || { echo "::error::'$NAME' is not a slot that can be deleted"; exit 1; }

    - name: Delete the apps
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        root=azure/staging
        target="slots/$NAME"
        [[ -d $root/$target ]] || exit 0
        if grep -qxF "$target" "$root/LOCKS" 2>/dev/null; then
          echo "::error::$target is locked"; exit 1
        fi
        rm -rf "${root:?}/$target"
        echo "Deleted staging/$target" >>"$GITHUB_STEP_SUMMARY"
