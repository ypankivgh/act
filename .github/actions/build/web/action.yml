name: Build web
description: >-
  Checks, tests and builds the admin app from a checkout, and uploads it as the artifact `web`
  (index.html with the commit baked in). Nothing that fails the checks gets as far as an artifact.

runs:
  using: composite
  steps:
    - name: Check, test and build
      shell: bash
      run: |
        set -euo pipefail
        bash app/test.sh
        mkdir -p "$RUNNER_TEMP/build"
        sed "s/__COMMIT__/$(git rev-parse HEAD)/" app/web/index.html >"$RUNNER_TEMP/build/index.html"

    - name: Package
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/web"
        cp "$RUNNER_TEMP/build/index.html" "$RUNNER_TEMP/web/index.html"

    - uses: actions/upload-artifact@v4
      with:
        name: web
        path: ${{ runner.temp }}/web/
        if-no-files-found: error
