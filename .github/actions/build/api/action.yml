name: Build API
description: >-
  Builds and tests the API and the function host from a checkout, and uploads them as the artifact
  `api` (api/version.json, func/version.json, each with the commit baked in). Nothing that fails
  the tests gets as far as an artifact.

runs:
  using: composite
  steps:
    - name: Build and test
      shell: bash
      run: bash app/test.sh

    - name: Publish and package
      shell: bash
      run: |
        set -euo pipefail
        for service in api func; do
          mkdir -p "$RUNNER_TEMP/api/$service"
          sed -e "s/__COMMIT__/$(git rev-parse HEAD)/" -e "s/__BUILT_AT__/$(date -u +%FT%TZ)/" \
            "app/$service/version.json" >"$RUNNER_TEMP/api/$service/version.json"
        done

    - uses: actions/upload-artifact@v4
      with:
        name: api
        path: ${{ runner.temp }}/api/
        if-no-files-found: error
