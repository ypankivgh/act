name: Deploy
description: >-
  Deploys everything into one slot of one environment: the API, the function host and the admin app
  from this run's `api` and `web` artifacts, and the slot's scan worker. Records the commit on the
  slot as commit.txt, which the swap reads. The slot's settings.json is never touched. Needs the
  _azure_ branch at azure/; save afterwards.

inputs:
  env:
    description: staging or prod.
    required: true
  slot:
    description: production, preprod or a PR's slot. Prod's production is refused, reached only by swap.
    required: true
  commit:
    description: The commit the artifacts and image were built from.
    required: true
  worker-image:
    description: Image the slot's scan worker should run.
    required: true

runs:
  using: composite
  steps:
    - name: Refuse prod's production slot
      if: inputs.env == 'prod' && inputs.slot == 'production'
      shell: bash
      run: |
        echo "::error::Code reaches prod's production slot only by swap"
        exit 1

    - uses: actions/download-artifact@v4
      with:
        name: api
        path: ${{ runner.temp }}/api

    - uses: actions/download-artifact@v4
      with:
        name: web
        path: ${{ runner.temp }}/web

    # Each of the next three steps stands in for one webapps-deploy / functions-action step. Like
    # those, it fails when the slot does not exist: Slot up or Infra creates slots, deploy never does.
    - name: Deploy the API
      shell: bash
      env:
        SLOT_DIR: azure/${{ inputs.env }}/slots/${{ inputs.slot }}
      run: |
        set -euo pipefail
        [[ -f $SLOT_DIR/settings.json ]] || { echo "::error::${SLOT_DIR#azure/} does not exist"; exit 1; }
        rm -rf "$SLOT_DIR/api" && cp -r "$RUNNER_TEMP/api/api" "$SLOT_DIR/api"

    - name: Deploy the function host
      shell: bash
      env:
        SLOT_DIR: azure/${{ inputs.env }}/slots/${{ inputs.slot }}
      run: |
        set -euo pipefail
        rm -rf "$SLOT_DIR/func" && cp -r "$RUNNER_TEMP/api/func" "$SLOT_DIR/func"

    - name: Deploy the admin app
      shell: bash
      env:
        SLOT_DIR: azure/${{ inputs.env }}/slots/${{ inputs.slot }}
      run: cp "$RUNNER_TEMP/web/index.html" "$SLOT_DIR/index.html"

    - name: Roll the scan worker and record the commit
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        SLOT: ${{ inputs.slot }}
        COMMIT: ${{ inputs.commit }}
        IMAGE: ${{ inputs.worker-image }}
      run: |
        set -euo pipefail
        slot_dir="azure/$ENV/slots/$SLOT"
        cp "azure/$ENV/registry/$IMAGE" "$slot_dir/worker.txt"
        echo "$COMMIT" >"$slot_dir/commit.txt"
        echo "Deployed \`${COMMIT:0:7}\` to $ENV / $SLOT" >>"$GITHUB_STEP_SUMMARY"
