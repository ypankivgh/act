name: Swap
description: >-
  Swaps prod's preprod and production: the API, the function host and the admin app (each checked
  first), the two scan workers' images, and the commit records. settings.json never moves (sticky),
  so each slot keeps its data and Shopify app. Outputs the commits now in production. Needs the
  _azure_ branch at azure/; save afterwards.

outputs:
  api-commit:
    description: API commit now in production.
    value: ${{ steps.tags.outputs.commit }}
  web-commit:
    description: Web commit now in production (the same commit: one repository).
    value: ${{ steps.tags.outputs.commit }}

runs:
  using: composite
  steps:
    # Stands in for swap with preview: in Azure, preprod restarts with production's settings and must
    # answer its health check before traffic moves. Here the check is that preprod's copy of the app
    # is there and well formed. A failed check stops before that app moves. Backend before the
    # admin app that calls it.
    - name: Swap the apps
      shell: bash
      run: |
        set -euo pipefail
        slots=azure/prod/slots
        healthy() {
          case $1 in
            api|func)   jq -e .commit "$slots/preprod/$1/version.json" >/dev/null 2>&1 ;;
            index.html) [[ -f $slots/preprod/index.html ]] ;;
          esac
        }
        for app in api func index.html; do
          healthy "$app" || { echo "::error::preprod's $app failed its check; nothing more was swapped"; exit 1; }
          tmp=$(mktemp -d)
          mv "$slots/preprod/$app" "$tmp/"
          if [[ -e $slots/production/$app ]]; then mv "$slots/production/$app" "$slots/preprod/"; fi
          mv "$tmp/$app" "$slots/production/"
          echo "Swapped $app" >>"$GITHUB_STEP_SUMMARY"
        done

    # Container Apps has no slots: the two workers trade images, so the preprod worker keeps the
    # previous version just like the preprod slot.
    - name: Swap the worker images
      shell: bash
      run: |
        set -euo pipefail
        slots=azure/prod/slots
        tmp=$(mktemp)
        cp "$slots/preprod/worker.txt" "$tmp"
        if [[ -f $slots/production/worker.txt ]]; then cp "$slots/production/worker.txt" "$slots/preprod/worker.txt"; fi
        cp "$tmp" "$slots/production/worker.txt"

    # In Azure the commit is a tag on the slot resource, which does not move with a swap, so it is
    # swapped here. commit.txt behaves the same way for the same reason: this step moves it.
    - name: Swap the commit tags
      id: tags
      shell: bash
      run: |
        set -euo pipefail
        slots=azure/prod/slots
        production=$(cat "$slots/production/commit.txt" 2>/dev/null || true)
        preprod=$(cat "$slots/preprod/commit.txt")
        echo "$preprod" >"$slots/production/commit.txt"
        if [[ -n $production ]]; then echo "$production" >"$slots/preprod/commit.txt"; fi
        echo "commit=$preprod" >>"$GITHUB_OUTPUT"
        echo "Production now runs \`${preprod:0:7}\`; preprod holds \`${production:0:7}\`" >>"$GITHUB_STEP_SUMMARY"
