name: Shopify
description: >-
  "Deploys" one Shopify app: records in azure/shopify/<app>.json where it points and which commit it
  ships. For the `pr` app it first takes the PR slot's address (in the real thing, written into
  shopify.app.pr.toml); staging, preprod and prod point at fixed slots, like their static tomls.
  Needs the _azure_ branch at azure/; save afterwards.

inputs:
  app:
    description: staging, pr, preprod or prod.
    required: true
  commit:
    description: Commit whose storefront code ships.
    required: true
  url:
    description: The PR slot's address (pr only).
    default: ''

runs:
  using: composite
  steps:
    - name: Point the pr app at this PR
      if: inputs.app == 'pr'
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        [[ $URL =~ ^https://[a-z0-9./-]+$ ]] || { echo "::error::Unexpected URL '$URL'"; exit 1; }
        echo "POINTS_AT=$URL" >>"$GITHUB_ENV"

    - name: Deploy
      shell: bash
      env:
        APP: ${{ inputs.app }}
        COMMIT: ${{ inputs.commit }}
        PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      run: |
        set -euo pipefail
        case "$APP" in
          staging) url="$PAGES/staging/slots/production/" ;;
          preprod) url="$PAGES/prod/slots/preprod/" ;;
          prod)    url="$PAGES/prod/slots/production/" ;;
          pr)      url=$POINTS_AT ;;
          *)       echo "::error::Unknown app '$APP'"; exit 1 ;;
        esac
        mkdir -p azure/shopify
        jq -n --arg app "$APP" --arg url "$url" --arg commit "$COMMIT" --arg at "$(date -u +%FT%TZ)" \
          '{app: $app, pointsAt: $url, commit: $commit, deployedAt: $at}' >"azure/shopify/$APP.json"
        echo "Shopify app \`$APP\` → $url" >>"$GITHUB_STEP_SUMMARY"
