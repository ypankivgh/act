name: Hello manual

on:
  workflow_dispatch:
    inputs:
      name:
        description: Who to greet
        type: string
        required: true
        default: world
      env:
        description: Target environment
        type: choice
        options: [ dev, staging, prod ]
        default: dev
      shout:
        description: Uppercase the greeting
        type: boolean
        default: false
      times:
        description: How many times
        type: number
        default: 1

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Greet
        env:
          NAME: ${{ inputs.name }}
          TARGET: ${{ inputs.env }}
          SHOUT: ${{ inputs.shout }}
          TIMES: ${{ inputs.times }}
        run: |
          msg="Hello, $NAME (env: $TARGET)"
          if [ "$SHOUT" = "true" ]; then msg="${msg^^}"; fi
          for i in $(seq 1 "$TIMES"); do echo "$msg"; done