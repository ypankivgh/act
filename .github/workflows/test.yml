name: Hello

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello from ${{ github.ref_name }} at ${{ github.sha }}"

      - name: Show who pushed and the commit message
        env:
          ACTOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "Pushed by: $ACTOR"
          echo "Message:   $MESSAGE"

      - name: Dump the whole push event
        run: jq . "$GITHUB_EVENT_PATH"
